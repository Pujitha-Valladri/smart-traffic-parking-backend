# ---- Database (values come from environment variables or from backend/.env) ----
# Optional file: copy .env.example to .env and put your real MySQL password there.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}

spring.datasource.username=${MYSQLUSER}

spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Application settings ----
server.port=8080
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.cors-allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Parking rates in INR per hour
app.parking.rate.car=30
app.parking.rate.bike=10
app.parking.rate.ev=40
